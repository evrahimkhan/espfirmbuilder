name: ESPForge quality checks

"on":
  pull_request: {}
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: PHP syntax
        run: find config public/api src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security header regression tests
        run: php tests/SecurityHeadersTest.php
      - name: Policy version regression tests
        run: php tests/PolicyVersionTest.php
      - name: Telemetry policy regression tests
        run: php tests/TelemetryPolicyTest.php
      - name: Analysis queue policy regression tests
        run: php tests/AnalysisQueuePolicyTest.php
      - name: Project profile regression tests
        run: php tests/ProjectProfileTest.php
      - name: Signed webhook regression tests
        run: php tests/GitHubWebhookPolicyTest.php
      - name: Authenticated production monitor policy tests
        run: |
          php tests/SyntheticMonitorPolicyTest.php
          bash -n bin/synthetic-monitor.sh
      - name: Pinned official metadata tests
        run: php tests/OfficialMetadataTest.php
      - name: Target parser regression tests
        run: php tests/TargetAnalyzerParserTest.php
      - name: Workflow safety regression tests
        run: php tests/WorkflowSafetyTest.php
      - name: Workflow generation regression tests
        run: php tests/WorkflowGenerationTest.php
      - name: JavaScript dependencies and formatting
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run format:check
          node --check public/assets/app.js
          node --check public/assets/dashboard.js
      - name: Browser end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: MariaDB migration integration
        run: bash tests/MigrationIntegrationTest.sh
