name: ESPForge quality checks

"on":
  pull_request: {}
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: PHP syntax
        run: find config public/api src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security header regression tests
        run: php tests/SecurityHeadersTest.php
      - name: Target parser regression tests
        run: php tests/TargetAnalyzerParserTest.php
      - name: Workflow safety regression tests
        run: php tests/WorkflowSafetyTest.php
      - name: Workflow generation regression tests
        run: php tests/WorkflowGenerationTest.php
      - name: JavaScript syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/dashboard.js
      - name: MariaDB migration integration
        run: bash tests/MigrationIntegrationTest.sh
